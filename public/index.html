<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f08">
  <title>Королевская Смута</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="game-board">
    <div class="player-area top" id="player-top">
      <div class="player-info"><span class="player-name">Игрок 3</span> <span class="player-score">0 очков</span></div>
      <div class="active-slots"></div>
    </div>

    <div class="player-area left" id="player-left">
      <div class="player-info"><span class="player-name">Игрок 2</span> <span class="player-score">0 очков</span></div>
      <div class="active-slots"></div>
    </div>

    <div class="center-area">
      <div id="game-log" class="log-parchment">Смута начинается...</div>
      <button id="roll-dice-btn" class="action-btn">🎲 Бросить кубик</button>
      <div class="dice-container">
        <div id="dice-result" class="dice-box">?</div>
      </div>
    </div>

    <div class="player-area right" id="player-right">
      <div class="player-info"><span class="player-name">Игрок 4</span> <span class="player-score">0 очков</span></div>
      <div class="active-slots"></div>
    </div>

    <div class="player-area bottom active-turn" id="player-bottom">
      <div class="player-info"><span class="player-name">Вы</span> <span class="player-score">0 очков</span></div>
      <!-- Здесь рука будет заполняться автоматически через JS -->
      <div class="my-hand" id="my-hand"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
